[project]
name = "ups-kulka"
version = "0.1.0"
description = "Backend for the UPS! Kulka balloon shop"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",  # sync driver for Alembic migrations
    "dependency-injector>=4.46",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ups_kulka"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PT", "C4", "T20", "ERA"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the intended pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["ERA001"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["ups_kulka"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["ups_kulka.modules.*.domain.*", "ups_kulka.modules.*.application.*", "ups_kulka.shared.domain.*", "ups_kulka.shared.application.*"]
strict = true

[[tool.mypy.overrides]]
module = ["dependency_injector.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL (testcontainers or TEST_DATABASE_URL)",
]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.coverage.run]
source = ["src/ups_kulka"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
