name: ups-kulka-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ups
      POSTGRES_PASSWORD: ups
      POSTGRES_DB: ups_kulka
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ups -d ups_kulka"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
