# One environment of the shop (production or staging) on the VPS.
# Started by deploy.sh: docker compose -p ups-kulka-<env> --env-file ../env/<env>.env ...
# Caddy (edge/compose.yml) reaches web and api over the shared "edge" network.
name: ups-kulka-${DEPLOY_ENV:?}

x-api-env: &api-env
  UPS_ENVIRONMENT: ${DEPLOY_ENV}
  UPS_DATABASE_URL: postgresql+asyncpg://ups:${POSTGRES_PASSWORD:?}@db:5432/ups_kulka
  UPS_PUBLIC_BASE_URL: ${SITE_URL:?}
  UPS_MEDIA_ROOT: /data/media
  UPS_ADMIN_PASSWORD: ${UPS_ADMIN_PASSWORD:?}
  UPS_ADMIN_SECRET_KEY: ${UPS_ADMIN_SECRET_KEY:?}
  UPS_MONOBANK_TOKEN: ${UPS_MONOBANK_TOKEN:-}
  UPS_TELEGRAM_BOT_TOKEN: ${UPS_TELEGRAM_BOT_TOKEN:-}
  UPS_TELEGRAM_CHAT_ID: ${UPS_TELEGRAM_CHAT_ID:-}

services:
  web:
    image: ${IMAGE_PREFIX:?}-web:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL}
      SITE_NOINDEX: ${SITE_NOINDEX:-}
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      default: {}
      edge:
        aliases: ["${DEPLOY_ENV}-web"]

  api:
    image: ${IMAGE_PREFIX}-api:${IMAGE_TAG}
    restart: unless-stopped
    environment: *api-env
    volumes:
      - ${DATA_DIR:?}/media:/data/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      default: {}
      edge:
        aliases: ["${DEPLOY_ENV}-api"]

  # Run once per deploy before api starts: docker compose run --rm migrate
  migrate:
    image: ${IMAGE_PREFIX}-api:${IMAGE_TAG}
    profiles: ["tools"]
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ups
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ups_kulka
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ups -d ups_kulka"]
      interval: 5s
      retries: 10
    # No ports: the database is reachable only inside this stack.

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ups
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ups_kulka
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${DATA_DIR}/media:/data/media:ro
      - ${DATA_DIR}/backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

networks:
  edge:
    external: true
