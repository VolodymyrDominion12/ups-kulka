<title>УПС! Кулька</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* УПС! Кулька — design tokens keep the palette of oops.kylka.shop */
@import url("https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap");

:root {
  --accent: #e6b3b3;
  --accent-dark: #d99999;
  --accent-soft: #f5dede;
  --rose: #c06f6f;
  --rose-deep: #8a4f4f;
  --text: #111111;
  --muted: #6f6f6f; /* old #8b8b8b darkened to pass 4.5:1 on white */
  --line: #eadada;
  --bg: #ffffff;
  --surface: #fff8f8;

  --font-display: "Comfortaa", "Manrope", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --r-photo: 22px;
  --r-panel: 28px;
  --pill: 999px;
  --wrap: 1200px;
  --gutter: clamp(16px, 4vw, 32px);
  --shadow-pop: 0 18px 40px -18px rgba(138, 79, 79, 0.45);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gutter); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 24px; border-radius: var(--pill);
  border: 0; font-weight: 700; text-decoration: none;
  transition: background-color .15s, transform .15s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--text); color: #fff; }
.btn-primary:hover { background: var(--rose-deep); }
.btn-soft { background: var(--accent-soft); color: var(--rose-deep); }
.btn-soft:hover { background: var(--accent); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 0;
  display: grid; place-items: center; background: var(--accent-soft); color: var(--rose-deep);
}

/* ---------- header ---------- */
.header { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.header-row { display: flex; align-items: center; gap: 16px; height: 68px; }
.logo { font: 700 22px/1 var(--font-display); text-decoration: none; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.logo-dot { width: 22px; height: 26px; border-radius: 50% 50% 48% 48%; background: radial-gradient(circle at 35% 30%, #fff6 0 18%, transparent 19%), var(--accent); position: relative; }
.logo-dot::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 6px; height: 5px; transform: translateX(-50%); background: var(--accent-dark); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.header-nav { display: flex; gap: 22px; margin-left: 24px; }
.header-nav a { text-decoration: none; font-weight: 600; color: var(--muted); }
.header-nav a:hover { color: var(--text); }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.header-phone { font-weight: 700; text-decoration: none; }
.cart-btn { position: relative; }
.cart-count {
  position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px;
  border-radius: var(--pill); background: var(--rose); color: #fff; font: 700 12px/20px var(--font-body); text-align: center;
}

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--accent-soft) 0%, #fff 100%); }
.hero-grid { display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; gap: 24px; min-height: 560px; padding-block: 48px 72px; }
.hero h1 {
  font: 700 clamp(44px, 7vw, 88px)/0.98 var(--font-display);
  letter-spacing: -.035em; margin: 0 0 20px; color: var(--rose-deep);
}
.hero h1 span { display: block; color: var(--text); font-size: .52em; letter-spacing: -.02em; line-height: 1.12; margin-top: 12px; }
.hero p { font-size: 18px; max-width: 46ch; margin: 0 0 28px; color: #3a3a3a; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }
.hero-facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 32px 0 0; padding: 0; list-style: none; font-weight: 600; color: var(--rose-deep); }

/* balloon cluster: product photos cut into balloon shapes, tied with strings */
.bunch { position: relative; height: 500px; }
.balloon {
  position: absolute; width: var(--w); aspect-ratio: 5 / 6;
  left: var(--x); top: var(--y);
  animation: rise 1.4s cubic-bezier(.2,.8,.2,1) var(--d, 0s) both, sway 7s ease-in-out calc(var(--d, 0s) + 1.4s) infinite alternate;
  transform-origin: 50% 160%;
}
.balloon-skin {
  width: 100%; height: 100%; border-radius: 50% 50% 47% 47% / 54% 54% 46% 46%;
  overflow: hidden; background: var(--accent);
  box-shadow: inset -14px -18px 30px rgba(138,79,79,.28), var(--shadow-pop);
  position: relative;
}
.balloon-skin img { width: 100%; height: 100%; object-fit: cover; }
.balloon-skin::after { /* glossy highlight */
  content: ""; position: absolute; left: 18%; top: 12%; width: 22%; height: 16%;
  border-radius: 50%; background: rgba(255,255,255,.55); filter: blur(2px); transform: rotate(-30deg);
}
.balloon::before { /* knot */
  content: ""; position: absolute; left: 50%; top: 99%; width: 14px; height: 10px; transform: translateX(-50%);
  background: var(--accent-dark); clip-path: polygon(50% 0, 100% 100%, 0 100%);
}
.balloon::after { /* string */
  content: ""; position: absolute; left: 50%; top: calc(100% + 9px); width: 2px; height: var(--s, 140px);
  background: linear-gradient(var(--accent-dark), transparent); transform: rotate(var(--sr, 0deg)); transform-origin: top;
}
.balloon.plain .balloon-skin { background: radial-gradient(circle at 50% 50%, var(--c, var(--accent)) 60%, color-mix(in srgb, var(--c, var(--accent)) 70%, var(--rose-deep))); }
@keyframes rise { from { transform: translateY(120px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sway { from { rotate: -2.5deg; } to { rotate: 2.5deg; } }

/* ---------- toolbar / categories ---------- */
.shop { padding-block: 56px 24px; }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.section-head h2 { font: 700 clamp(28px, 4vw, 40px)/1.1 var(--font-display); letter-spacing: -.02em; margin: 0; }
.section-head p { margin: 0; color: var(--muted); }

.toolbar {
  position: sticky; top: 68px; z-index: 20; background: #fff;
  padding: 12px 0; margin-bottom: 20px; border-bottom: 1px solid var(--line);
}
.toolbar-row { display: flex; gap: 10px; align-items: center; }
.search {
  flex: 1; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px;
  border-radius: var(--pill); background: var(--surface); border: 1px solid var(--line);
}
.search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; }
.search:focus-within { border-color: var(--rose); }
.select { height: 48px; padding: 0 16px; border-radius: var(--pill); border: 1px solid var(--line); background: #fff; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px;
  border-radius: var(--pill); border: 1px solid var(--line); background: #fff; font-weight: 600; white-space: nowrap;
}
.chip small { color: var(--muted); font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; }
.chip[aria-pressed="true"] small { color: var(--accent); }
.chip.sale[aria-pressed="false"] { color: var(--rose); border-color: var(--accent); }

/* ---------- product grid ---------- */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px 20px; }
.card { position: relative; display: flex; flex-direction: column; }
.card-photo {
  position: relative; aspect-ratio: 1; border-radius: var(--r-photo); overflow: hidden;
  background: var(--accent-soft); border: 0; padding: 0;
}
.card-photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.card-photo:hover img { transform: scale(1.04); }
.badge {
  position: absolute; left: 12px; top: 12px; padding: 4px 10px; border-radius: var(--pill);
  background: var(--rose); color: #fff; font-weight: 700; font-size: 13px;
}
.card-body { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding-top: 12px; }
.card-title { margin: 0; font-weight: 600; font-size: 15px; line-height: 1.35; }
.card-title button { all: unset; cursor: pointer; }
.card-title button:focus-visible { outline: 3px solid var(--rose); border-radius: 4px; }
.price { font-weight: 800; color: var(--rose-deep); font-size: 17px; margin-top: 4px; white-space: nowrap; }
.price s { color: var(--muted); font-weight: 500; font-size: 14px; margin-left: 6px; }
.add { flex: none; }
.add .icon-btn { width: 44px; height: 44px; background: var(--text); color: #fff; font-size: 22px; }
.add .icon-btn:hover { background: var(--rose-deep); }
.stepper { display: inline-flex; align-items: center; border-radius: var(--pill); background: var(--accent-soft); }
.stepper button { width: 36px; height: 44px; border: 0; background: none; font-size: 20px; color: var(--rose-deep); }
.stepper output { min-width: 18px; text-align: center; font-weight: 700; }
.more { display: flex; justify-content: center; margin-top: 36px; }
.empty { text-align: center; padding: 64px 0; color: var(--muted); }
.empty strong { display: block; color: var(--text); font: 700 22px/1.3 var(--font-display); margin-bottom: 8px; }
.skeleton { aspect-ratio: 1; border-radius: var(--r-photo); background: linear-gradient(90deg, var(--accent-soft), #fff, var(--accent-soft)); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- perks / faq / footer ---------- */
.perks { padding-block: 64px; }
.perks-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.perk h3 { font: 700 20px/1.25 var(--font-display); margin: 12px 0 6px; }
.perk p { margin: 0; color: var(--muted); max-width: 34ch; }
.perk-icon { width: 52px; height: 60px; border-radius: 50% 50% 47% 47% / 54% 54% 46% 46%; display: grid; place-items: center; font-size: 24px; background: var(--accent-soft); }

.faq { padding-block: 24px 72px; }
.faq-list { max-width: 760px; }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; padding: 20px 0; font-weight: 700; font-size: 17px; display: flex; justify-content: space-between; gap: 16px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-size: 24px; line-height: 1; color: var(--rose); transition: transform .2s; }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq details p { margin: 0 0 20px; color: #3a3a3a; max-width: 64ch; }

.footer { background: var(--text); color: #fff; padding-block: 56px 96px; }
.footer-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 32px; }
.footer .logo { color: #fff; }
.footer h4 { margin: 0 0 12px; font-size: 15px; color: var(--accent); }
.footer p, .footer a { color: #e8e8e8; margin: 0 0 8px; display: block; text-decoration: none; }
.footer a:hover { color: #fff; text-decoration: underline; }

/* ---------- overlay: drawer & modal ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(17,17,17,.42); animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.drawer {
  position: fixed; z-index: 60; top: 0; right: 0; bottom: 0; width: min(440px, 100%);
  background: #fff; display: flex; flex-direction: column; animation: slide .25s cubic-bezier(.2,.8,.2,1);
}
@keyframes slide { from { transform: translateX(100%); } }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0; font: 700 22px/1.2 var(--font-display); }
.drawer-body { flex: 1; overflow-y: auto; padding: 8px 20px 20px; }
.drawer-foot { padding: 16px 20px 20px; border-top: 1px solid var(--line); }
.total-row { display: flex; justify-content: space-between; font-weight: 800; font-size: 18px; margin-bottom: 14px; }
.line { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.line img { width: 72px; height: 72px; border-radius: 16px; object-fit: cover; background: var(--accent-soft); }
.line-title { font-weight: 600; font-size: 15px; margin: 0 0 4px; }
.line-price { color: var(--rose-deep); font-weight: 700; }
.link-btn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 14px; }

.modal {
  position: fixed; z-index: 60; inset: 0; margin: auto; width: min(880px, calc(100% - 32px)); height: fit-content; max-height: calc(100% - 32px);
  overflow: auto; background: #fff; border-radius: var(--r-panel); display: grid; grid-template-columns: 1fr 1fr;
  animation: pop .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes pop { from { transform: scale(.96); opacity: 0; } }
.modal img { width: 100%; height: 100%; aspect-ratio: 1; object-fit: cover; background: var(--accent-soft); }
.modal-body { padding: 32px; display: flex; flex-direction: column; gap: 14px; }
.modal-body h2 { font: 700 28px/1.15 var(--font-display); margin: 0; letter-spacing: -.01em; }
.modal-body .price { font-size: 24px; }
.modal-close { position: absolute; top: 14px; right: 14px; }
.modal-note { color: var(--muted); margin: 0; }
.modal-note li { margin-bottom: 4px; }

/* ---------- form ---------- */
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: 14px; }
.field input, .field textarea, .field select {
  height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
}
.field textarea { height: 88px; padding: 12px 14px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus { outline: 0; border-color: var(--rose); background: #fff; }
.field-error { color: #b3261e; font-size: 13px; }
.segmented { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: var(--pill); background: var(--accent-soft); }
.segmented button { height: 42px; border: 0; border-radius: var(--pill); background: none; font-weight: 700; color: var(--rose-deep); }
.segmented button[aria-pressed="true"] { background: #fff; color: var(--text); box-shadow: 0 2px 8px rgba(138,79,79,.15); }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.alert { padding: 12px 14px; border-radius: 14px; background: #fdecea; color: #8c1d18; font-size: 14px; }
.success { text-align: center; padding: 40px 8px; }
.success .perk-icon { margin: 0 auto 16px; width: 72px; height: 84px; font-size: 34px; }
.success h3 { font: 700 24px/1.2 var(--font-display); margin: 0 0 8px; }
.success p { color: var(--muted); margin: 0 0 24px; }

/* ---------- mobile bar ---------- */
.mobile-bar { display: none; }
.fab-row { position: fixed; right: 18px; bottom: 18px; z-index: 25; display: flex; flex-direction: column; gap: 10px; }
.fab { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; text-decoration: none; font-size: 22px; background: #fff; box-shadow: var(--shadow-pop); }

/* ---------- responsive ---------- */
@media (max-width: 1024px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
  .header-nav { display: none; }
}
@media (max-width: 760px) {
  .hero-grid { grid-template-columns: 1fr; min-height: 0; padding-block: 32px 40px; }
  .bunch { height: 320px; order: -1; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 22px 12px; }
  .card-body { flex-direction: column; }
  .add { align-self: stretch; }
  .add .icon-btn, .add .stepper { width: 100%; border-radius: var(--pill); justify-content: space-between; }
  .add .icon-btn { height: 40px; font-size: 15px; font-weight: 700; }
  .perks-row, .footer-grid { grid-template-columns: 1fr; }
  .modal { grid-template-columns: 1fr; }
  .modal-body { padding: 22px; }
  .header-phone { display: none; }
  .select { padding: 0 10px; max-width: 132px; }
  .fab-row { bottom: 84px; }
  .mobile-bar {
    display: flex; position: fixed; z-index: 26; left: 12px; right: 12px; bottom: 12px;
    border-radius: var(--pill); background: var(--text); color: #fff; padding: 6px 6px 6px 20px;
    align-items: center; justify-content: space-between; box-shadow: var(--shadow-pop);
  }
  .mobile-bar .btn { min-height: 44px; background: var(--accent); color: var(--text); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* "+" on desktop, "+ Додати" on phones */
@media (max-width: 760px) { .add-label::after { content: "Додати"; margin-left: 6px; } }


/* ---- preview-only adjustments ---- */
/* Layout: one long shop page — balloon hero, sticky filters, photo grid, quiet perks/FAQ, dark footer. */
.wrap { padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }
.header { top: env(safe-area-inset-top, 0px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
.toolbar { top: calc(68px + env(safe-area-inset-top, 0px)); }
.fab-row { right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.demo-note { background: var(--text); color: #fff; font-size: 13px; text-align: center; padding-block: 8px; }
.demo-note .wrap { display: block; }
/* illustrated stand-ins for product photos (real photos load from the shop in the app) */
.ph { position: absolute; inset: 0; background: var(--bg-ph, var(--accent-soft)); overflow: hidden; }
.ph i { position: absolute; width: var(--s); aspect-ratio: 5/6; left: var(--x); top: var(--y); border-radius: 50% 50% 47% 47% / 54% 54% 46% 46%;
  background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.65) 0 9%, transparent 10%), var(--c); box-shadow: inset -8px -10px 18px rgba(0,0,0,.14); }
.ph i::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1.5px; height: 70%; background: rgba(138,79,79,.35); }
.ph b { position: absolute; left: 12px; bottom: 10px; right: 12px; font: 700 13px/1.2 var(--font-display); color: var(--rose-deep); opacity: .75; }
.line .ph, .modal .ph { position: relative; }
.line .thumb { width: 72px; height: 72px; border-radius: 16px; overflow: hidden; position: relative; }
.modal .ph { min-height: 320px; height: 100%; }
.modal .ph b { font-size: 18px; bottom: 18px; left: 22px; }
</style>

<div class="demo-note"><div class="wrap">Демо дизайну. Фото товарів у робочій версії підтягуються з сайту, тут замість них ілюстрації. Замовлення не надсилаються.</div></div>

}

function filtered() {

}

  const o = $("#overlay");
  document.body.style.overflow = S.product || S.drawer ? "hidden" : "";
  if (S.product) {
    const p = S.product;
    o.innerHTML = `<div class="scrim" data-close></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="pm-title">
      ${ph(p)}<div class="modal-body"><h2 id="pm-title">${esc(p.title)}</h2><div class="price">${price(p)}</div>
      <ul class="modal-note"><li>Доставка таксі по Києву або самовивіз</li><li>Кольори й напис можна змінити: напишіть у коментарі</li></ul>
      <div style="margin-top:auto;display:grid;gap:10px">${addCtl(p, true)}${S.cart[p.id] ? `<button class="btn btn-soft btn-block" data-cart>Перейти до кошика</button>` : ""}</div></div>
      <button class="icon-btn modal-close" data-close aria-label="Закрити">✕</button></div>`;
    return;
  }
  if (!S.drawer) { o.innerHTML = ""; return; }
  const lines = cartLines();
  let title = "Кошик", body = "", foot = "";
  if (S.drawer === "done") {
    title = "Дякуємо!";
    body = `<div class="success"><div class="perk-icon" aria-hidden="true">🎈</div><h3>Замовлення №${S.orderNo} прийнято</h3><p>Менеджер зателефонує найближчим часом, щоб підтвердити деталі. Сума: ${uah(S.orderTotal)}.</p><button class="btn btn-primary" data-close>Повернутися до каталогу</button></div>`;
  } else if (!lines.length) {
    body = `<div class="success"><div class="perk-icon" aria-hidden="true">🎈</div><h3>Кошик порожній</h3><p>Додайте композицію з каталогу, і вона зʼявиться тут.</p><button class="btn btn-primary" data-close>До каталогу</button></div>`;
  } else if (S.drawer === "cart") {
    body = `<ul style="list-style:none;margin:0;padding:0">${lines.map(({ p, q }) => `<li class="line"><div class="thumb">${ph(p, false)}</div>
      <div><p class="line-title">${esc(p.title)}</p><span class="line-price">${uah(p.price * q)}</span></div>
      <div style="display:grid;justify-items:end;gap:4px">${addCtl(p)}<button class="link-btn" data-set="${p.id}:0">Видалити</button></div></li>`).join("")}</ul>`;
    foot = `<div class="total-row"><span>Разом</span><span>${uah(cartTotal())}</span></div><button class="btn btn-primary btn-block" data-step="checkout">Оформити замовлення</button>`;
  } else {
    title = "Оформлення";
    const today = new Date().toISOString().slice(0, 10);
    body = `<form class="form" id="checkout" style="padding-top:12px" novalidate>
      <div class="field"><label for="c-name">Імʼя</label><input id="c-name" name="name" autocomplete="given-name" value="Олена"></div>
      <div class="field"><label for="c-phone">Телефон</label><input id="c-phone" name="phone" type="tel" placeholder="093 123 45 67" value="093 111 22 33"><span class="field-error" id="phoneErr" hidden>Вкажіть номер у форматі 093 123 45 67</span></div>
      <div class="segmented" role="group" aria-label="Спосіб отримання"><button type="button" data-method="pickup" aria-pressed="${S.method === "pickup"}">Самовивіз</button><button type="button" data-method="taxi" aria-pressed="${S.method === "taxi"}">Таксі</button></div>
      ${S.method === "taxi" ? `<div class="field"><label for="c-addr">Адреса в Києві</label><input id="c-addr" name="address" placeholder="Вулиця, будинок, квартира"><span class="field-error" id="addrErr" hidden>Вкажіть адресу для таксі</span><span style="font-size:13px;color:var(--muted)">Таксі викличемо ми, поїздку ви оплачуєте за тарифом таксі.</span></div>` : ""}
      <div class="row-2"><div class="field"><label for="c-date">Дата</label><input id="c-date" name="date" type="date" min="${today}"></div>
      <div class="field"><label for="c-slot">Час</label><select id="c-slot" name="slot"><option value="">Будь-коли</option>${["10–12", "12–14", "14–16", "16–18", "18–20"].map((s) => `<option>${s}</option>`).join("")}</select></div></div>
      <div class="field"><label for="c-comment">Коментар</label><textarea id="c-comment" name="comment" placeholder="Колір, напис на кульці, побажання"></textarea></div>
      <p style="margin:0;font-size:14px">💵 Оплата при отриманні</p>
      <div class="total-row" style="margin-top:6px"><span>За товари</span><span>${uah(cartTotal())}</span></div>
      <button class="btn btn-primary btn-block">Підтвердити замовлення</button>
      <button type="button" class="link-btn" data-step="cart" style="justify-self:center">Повернутися до кошика</button></form>`;
  }
  o.innerHTML = `<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="cart-title">
    <div class="drawer-head"><h2 id="cart-title">${title}</h2><button class="icon-btn" data-close aria-label="Закрити">✕</button></div>
    <div class="drawer-body">${body}</div>${foot ? `<div class="drawer-foot">${foot}</div>` : ""}</aside>`;
}

function renderDynamic() { renderResults(); renderHeader(); renderOverlay(); }
renderChips(); renderDynamic();

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-add],[data-set],[data-open],[data-close],[data-cart],[data-step],[data-method],[data-cat],[data-sale],[data-more],[data-reset],#cartBtn");
  if (!t) return;
  const d = t.dataset;
  if (d.add) setQty(d.add, (S.cart[d.add] || 0) + 1);
  else if (d.set) { const [id, q] = d.set.split(":"); setQty(id, +q); }
  else if (d.open) { S.product = byId[d.open]; renderOverlay(); $(".modal button")?.focus(); }
  else if ("close" in d) { S.product = null; S.drawer = null; renderOverlay(); }
  else if ("cart" in d || t.id === "cartBtn") { S.product = null; S.drawer = "cart"; renderOverlay(); $(".drawer button")?.focus(); }
  else if (d.step) { S.drawer = d.step; renderOverlay(); }
  else if (d.method) { S.method = d.method; renderOverlay(); }
  else if (d.cat !== undefined) { S.cat = d.cat || null; if (!d.cat) S.sale = false; S.shown = 24; renderChips(); renderResults(); }
  else if (d.sale) { S.sale = !S.sale; S.shown = 24; renderChips(); renderResults(); }
  else if ("more" in d) { S.shown += 24; renderResults(); }
  else if ("reset" in d) { S.cat = null; S.sale = false; S.q = ""; $("#q").value = ""; renderChips(); renderResults(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (S.product || S.drawer)) { S.product = null; S.drawer = null; renderOverlay(); } });
let qt; $("#q").addEventListener("input", (e) => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value; S.shown = 24; renderResults(); }, 200); });
$("#sort").addEventListener("change", (e) => { S.sort = e.target.value; renderResults(); });
document.addEventListener("submit", (e) => {
  if (e.target.id !== "checkout") return;
  e.preventDefault();
  const f = new FormData(e.target);
  const digits = String(f.get("phone")).replace(/\D/g, "");
  const okPhone = /^(380\d{9}|0\d{9})$/.test(digits);
  $("#phoneErr").hidden = okPhone;
  const addrOk = S.method !== "taxi" || String(f.get("address") || "").trim();
  if ($("#addrErr")) $("#addrErr").hidden = !!addrOk;
  if (!okPhone || !addrOk) return;
  S.orderNo = 1000 + Math.floor(Math.random() * 900); S.orderTotal = cartTotal();
  S.cart = {}; saveCart(); S.drawer = "done"; renderDynamic();
});
</script>
