name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ups
          POSTGRES_PASSWORD: ups
          POSTGRES_DB: ups_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ups -d ups_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ups:ups@localhost:5432/ups_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (unit, architecture, integration, migrations)
        run: uv run pytest --cov --cov-report=term-missing
      - name: OpenAPI contract is up to date
        run: uv run python scripts/export_openapi.py --check
